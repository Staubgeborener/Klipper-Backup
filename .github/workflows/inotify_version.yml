name: Update Inotify Version

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: docs

      - name: Get latest Inotify version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_version=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/inotify-tools/inotify-tools/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$latest_version" ] || [ "$latest_version" = "null" ]; then
            exit 1
          fi

          echo "$latest_version" > docs/inotify_version
          echo "Current version: $latest_version"

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- docs/inotify_version && git ls-files --error-unmatch docs/inotify_version >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/inotify_version
          git commit -m "Update Inotify version to $(cat docs/inotify_version)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.commit.outputs.changed == 'true'
        with:
          python-version: 3.x

      - name: Deploy docs
        if: steps.commit.outputs.changed == 'true'
        run: |
          pip install mkdocs-material mkdocs-video mkdocs-include-markdown-plugin mkdocs-macros-plugin
          mkdocs gh-deploy --force
